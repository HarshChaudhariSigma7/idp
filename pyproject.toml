[project]
name = "sereno-idp"
version = "0.1.0"
description = "Sereno Volante document extraction: accuracy-first IDP for Indian manufacturers"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=1.8,<2",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-multipart>=0.0.9",
  "opencv-python-headless>=4.9",
  "pillow>=10.3",
  "numpy>=1.26",
  "pypdfium2>=4.30",
  "pdfplumber>=0.11",
  "cryptography>=41",
  "argon2-cffi>=23.1",
  "pyotp>=2.9",
  "qrcode>=7.4",
  "rapidfuzz>=3.9",
  "openpyxl>=3.1",
  "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["sereno*"]

[tool.setuptools.package-data]
sereno = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
